calc(1.5mm*var(--fit));background:#dce8f4;border-left:3px solid #486581;color:#243b53;font-size:calc(8.8pt*var(--fit));font-weight:700}.role{display:block;margin:calc(1.6mm*var(--fit)) 0 calc(.8mm*var(--fit));padding:calc(1mm*var(--fit)) calc(1.5mm*var(--fit));background:#edf7f8;border-left:3px solid #0f766e;color:#0f4c5c;font-size:calc(8.8pt*var(--fit));font-weight:700}.event .role{background:#fff0f3;border-left-color:#c2415d;color:#9f1239}.media{margin-top:calc(2.5mm*var(--fit));padding:calc(2mm*var(--fit));border-left:4px solid #b7791f;background:#fff8e8;overflow:hidden}.media h3{margin:0 0 calc(1mm*var(--fit));padding:calc(1mm*var(--fit)) calc(1.5mm*var(--fit));background:#ffe8ad;color:#744210;font-size:calc(9.5pt*var(--fit))}.media .body{margin:0}.no-event{background:#f8fafc;color:#7b8794}aside{display:grid;grid-template-columns:calc(28mm*var(--fit)) 1fr;gap:calc(3mm*var(--fit));margin-top:calc(3mm*var(--fit));padding:calc(2.2mm*var(--fit)) calc(3mm*var(--fit));background:#f1f5f9;border-left:4px solid #486581;font-size:calc(8.5pt*var(--fit));line-height:1.38;max-height:calc(34mm*var(--fit));overflow:hidden}.aside-label{font-weight:700;color:#334e68}footer{margin-top:calc(2mm*var(--fit));padding-top:calc(1mm*var(--fit));border-top:1px solid #d9e2ec;color:#7b8794;font-size:calc(7pt*var(--fit))}@media print{.printbar{display:none}.sheet{margin:0;box-shadow:none;break-after:page;page-break-after:always}.sheet:last-child{break-after:auto;page-break-after:auto}}@media screen and (max-width:1100px){.sheet{width:auto;height:auto;min-height:100vh;margin:0;padding:5mm;overflow:visible}.timeline{grid-template-columns:1fr}.phase{min-height:0}.printbar{position:static}}

<script type="application/json" id="cases">[{"title":"症例1｜左血気胸・多発肋骨骨折","arrival_time":"0-3分","phase_1":"【コントローラー】救急車で到着。救急隊情報として「BP 78/52、HR 122、SpO2 85%RA→酸素後90%、RR 40」を提示する。 一次トリアージ所見：左胸部痛、呼吸困難、SpO2低下、左呼吸音減弱、顔面蒼白\n【傷病者役】左胸部を押さえ、浅く速い呼吸。会話は短い単語のみ。横になることを嫌がり座位を希望。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル「BP 78/52、HR 122、SpO2 85%RA→酸素後90%、RR 40」と診察所見「左胸部圧痛著明、左呼吸音減弱、顔面蒼白、呼吸苦著明。」を提示。検査：CT: 左血気胸、多発肋骨骨折。胸腔ドレーン挿入時の初期排液1000mL、その後150mL/hで持続出血。\n治療判断を確認：胸腔ドレーン、輸液・輸血、呼吸器外科コンサルト。150mL/hの持続出血では直ちに手術と決め打ちせず、ICUへ入室して経過観察する。ICU入室後に出血量が増大したら、ICUから手術室へ搬送して開胸止血し、術後はICU管理とする。\nチェック：□ 高流量酸素と気道・呼吸の評価\n□ 胸腔ドレーンを留置し初期排液量と時間排液量を記録\n□ 早期に輸血（大量輸血プロトコル）を開始\n□ 150mL/hの持続出血を受けて呼吸器外科へコンサルト\n□ ICU入室・経過観察を本部・ICUへ依頼\n□ ICU入室後の出血量増大を提示\n□ ICUから手術室への搬送と開胸止血を調整","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、コントローラーは「モニター画面のQRコード」を提示し、BP 78/52、HR 122、SpO2 85%RA→酸素後90%、RR 40を確認させる。\n【画像】プレイヤーが胸部CT撮影を決定した時点で、「CT画像のQRコード」を提示する。画像確認後に、左血気胸・多発肋骨骨折、胸腔ドレーン初期排液1000mL・以後150mL/hを伝える。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：救急車①で搬入する赤症例。直後（10:08）に症例2が乗用車で来院するため、初療ベッド配分と赤症例の優先順位判断を促す。胸腔ドレーン後は排液150mL/hで持続するため、呼吸器外科へコンサルトし、ICUへ入室して経過観察とする。\n【ICU入室後の急変】排液量・出血量が増大し、血圧低下・呼吸状態悪化を提示する。ICUから手術室へ搬送して開胸止血を行う判断を促す。\n【対応できた場合】ICUで経過観察後、急変を認識して手術室へ搬送し、開胸止血・術後ICU管理へ進む。\n【遅れた場合】150mL/hの持続出血を見逃し、出血量が増大。BP 60台・HR 140以上、換気困難へ悪化する。\n【傷病者役】左胸部を押さえ、浅く速い呼吸。会話は短い単語のみ。初療後は呼吸が少し楽になるが、ICU入室後の急変はコントローラー提示のみとする。","notes":"ムラージュ：不要\n学習ポイント：初期排液1000mL後に150mL/hで持続する出血では、輸血・ドレーン管理と反復評価を行いながら呼吸器外科へコンサルトし、ICUで経過観察する。ICU入室後に出血量が増大したら、ICUから手術室へ搬送して開胸止血する。"},{"title":"症例2｜不安定型骨盤骨折","arrival_time":"0-3分","phase_1":"【コントローラー】乗用車で到着。一次トリアージ所見を順に提示する。 一次トリアージ所見：歩行: 歩行不可扱い（または歩行可能に見えても立位保持困難）。呼吸: RR 30。循環: 脈拍数140、橈骨動脈触知不良、冷汗あり。意識: JCS30、簡単な指示に従えない\n【傷病者役】刺激で開眼するがすぐ閉眼。意味のある会話は困難。左骨盤部を触られると痛みで反応。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル「BP 74/42、HR 140、SpO2 94%RA、RR 30」と診察所見「顔面蒼白、冷汗著明、左骨盤部圧痛・変形、骨盤動揺性あり。」を提示。検査：骨盤X線/CT: 不安定型骨盤骨折。TAE後: Hb 7.2へ低下、乳酸 5.0mmol/L。\n治療判断を確認：サムスリング固定、輸液・輸血、TAE（AG）で止血。TAE後も血圧が不安定で輸血継続を要し、骨盤内パッキング・創外固定を検討のうえICU入室。\nチェック：□ 歩行可能に見えても赤へトリアージアップし救外へ誘導\n□ 骨盤ベルト（サムスリング）を早期に装着\n□ 骨盤動揺性の反復診察を避ける\n□ 輸液・輸血（大量輸血プロトコル）を開始\n□ AG室へTAEを依頼し搬送を調整\n□ TAE後に再評価し、輸血継続とICU入室を依頼","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、コントローラーは「モニター画面のQRコード」を提示し、BP 74/42、HR 140、SpO2 94%RA、RR 30を確認させる。\n【画像】プレイヤーが骨盤X線またはCT撮影を決定した時点で、「画像のQRコード」を提示する。不安定型骨盤骨折を確認後に、TAE後のHb 7.2、乳酸 5.0を数値で提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：乗用車1で来院。一見歩けそうに見えるが骨盤骨折によるショックで、トリアージアップして救外ゾーンへ直接誘導する判断を促す。TAE終了後にERで血圧再低下と乳酸上昇を付与し、輸血継続とICU入室依頼を判断させる（演技不要、コントローラーが数値で提示）。\n分岐：対応できた場合: 骨盤固定と輸血でBP 90台へ改善し、TAE後もICUで循環管理・輸血継続につなげられる。\n遅れた場合: 後腹膜出血が進行しBP 60台・HR 150へ。動揺性の反復診察や晶質液のみの補正で凝固障害が加わり循環虚脱に至る。\n【傷病者役】刺激で開眼するがすぐ閉眼。意味のある会話は困難。左骨盤部を触られると痛みで反応。","notes":"ムラージュ：不要\n学習ポイント：不安定型骨盤骨折では、骨盤の外固定と早期止血が重要。動揺性の反復診察は再出血を招くため避ける。TAE後も循環が不安定なら再出血・他部位出血を検索し、ICUで輸血を継続する。"},{"title":"症例3｜急性硬膜外血腫","arrival_time":"0-3分","phase_1":"【コントローラー】救急車で到着。救急隊情報として「来院時 HR 80、BP 160/80、SpO2 100%。初期JCS 10、GCS 11（E3V3M5）。」を提示する。\n一次トリアージ所見：頭部打撲、一時意識消失、瞳孔不同、徐脈・高血圧傾向\n【傷病者役】来院時はなんとか従命可能。CT後に意識レベル著明低下。痛み刺激に払いのけるのみ、発語なし。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：来院時 HR 80、BP 160/80、SpO2 100%。初期JCS 10、GCS 11（E3V3M5）\n診察所見：歩行不可。\n治療判断：気管挿管、緊急開頭血腫除去術。脳外傷術後のためICUまたはEUで管理。\n進行指示：初療時は従命可能、CT結果提示後にGCS低下・瞳孔不同を付与。脳神経外科・手術室・ICUへ緊急連絡し、気管挿管、緊急開頭血腫除去術、術後ICU管理へ進める。\n確認項目：□ 頭部CTの優先順位を判断し早期に撮影\n□ CT後の意識低下・瞳孔不同・徐脈＋高血圧を認識\n□ GCS≤8でRSIによる気管挿管を実施\n□ 脳神経外科・手術室へ緊急開頭を要請\n□ 術後のICU/EU入室を調整","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、来院時 HR 80、BP 160/80、SpO2 100%。初期JCS 10、GCS 11（E3V3M5）を確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、頭部CT: 急性硬膜外血腫。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：症例19（黄・右大腿骨骨折）と同時到着。救外・軽症ゾーンの振り分けを確認する。\n分岐・悪化条件：対応できた場合: 挿管で気道と換気が保たれ、早期の開頭血腫除去で神経学的予後が保たれる。\n遅れた場合: 舌根沈下・低酸素による二次性脳損傷が加わり、脳ヘルニアが進行して不可逆的な神経障害に至る。\n【傷病者役】来院時はなんとか従命可能。CT後に意識レベル著明低下。痛み刺激に払いのけるのみ、発語なし。","notes":"ムラージュ：不要\n学習ポイント：急性硬膜外血腫はlucid intervalの後に急速悪化するため、一時的な意識改善で油断しない。\n徐脈＋高血圧（Cushing現象）と片側瞳孔散大は切迫脳ヘルニアのサイン。\nGCS≤8では気道確保を行い、開頭血腫除去は時間依存性が高い。\n脳神経外科・手術室・ICUを同時に立ち上げる連携。"},{"title":"症例4｜左外踝骨折","arrival_time":"0-3分","phase_1":"【コントローラー】乗用車で到着。一次トリアージ所見を順に提示する。\n一次トリアージ所見：歩行: 歩行不可。呼吸: 見たまま安定。循環: 脈拍は見たまま、明らかなショックなし。意識: 指示に従える\n【傷病者役】支えれば立位可。痛み強い。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：実測値で安定\n診察所見：左外踝圧痛、腫脹。\n治療判断：シーネ固定\n進行指示：左足関節腫脹と歩行不可を提示。シーネ固定と画像検査の導線確認を促す。\n確認項目：□ 歩行不能の黄として軽症ゾーンへ誘導\n□ 末梢循環・知覚を確認\n□ X線を依頼し画像導線を確認\n□ シーネ固定と鎮痛を実施","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、実測値で安定を確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、X線で左外踝骨折。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：乗用車1の同乗者として来院。緑症例と同時に軽症ゾーンへ流入し、受付・画像導線を混雑させる。\n分岐・悪化条件：対応できた場合: シーネ固定と鎮痛で疼痛が軽減し、帰宅可能。\n遅れた場合: 固定されないまま移動を繰り返し疼痛と腫脹が増強、軽症ゾーンの車椅子・ストレッチャー不足が顕在化する。\n【傷病者役】支えれば立位可。痛み強い。","notes":"ムラージュ：左足関節腫脹\n学習ポイント：歩行不能は軽症に見えても黄として扱う。\n足関節外傷では外踝骨折を念頭に置き、末梢循環・知覚を確認する。\nシーネ固定と鎮痛で帰宅可能な症例でも、画像検査の導線確保が必要。"},{"title":"症例5｜回転性めまい・歩行不能→シートベルト損傷","arrival_time":"0-3分","phase_1":"【コントローラー】乗用車で到着。一次トリアージ所見を順に提示する。\n一次トリアージ所見：歩行: 歩行不能。呼吸: 見たまま安定。循環: 脈拍は見たまま、橈骨動脈触知良好。意識: 指示に従える（閉眼・嘔気あり）\n【傷病者役】開眼でめまい増強。点滴後にめまいは改善するが、コントローラーの合図で腹痛を訴える。以後は手術が決まったと伝えられるまで、かなり強い腹痛を訴え続け、腹部を押さえてぐったりする。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：BP 118/70、HR 88、SpO2 98%RA、RR 16\n診察所見：眼振あり、四肢麻痺なし。下腹部に斜めの帯状皮下出血・擦過（シートベルト痕）。腹痛出現後は臍周囲〜下腹部に強い圧痛と筋性防御、腸雑音低下。\n治療判断：点滴・鎮痛のうえ経過観察としたが、腹痛出現後にFAST陽性・造影CTで腸管損傷＋腸間膜損傷による腹腔内出血を確認し、シートベルト損傷として外科で緊急開腹（止血・損傷腸管の処理）。腹部術後のためICU管理。\n進行指示：シートベルト着用中の衝突で、車内での頭部打撲後にめまいが出現。神経局在なし、歩行不能、嘔気を提示する。点滴開始後、合図で腹痛を訴えさせ、下腹部の帯状皮下出血（シートベルト痕）、BP 86/58・HR 122、FAST陽性、造影CTで腸管損傷＋腸間膜損傷による腹腔内出血を提示。軽症ゾーンから救外への移送、外科コンサルト、緊急開腹と術後ICU入室の調整を判断させる。学生には手術決定が伝えられるまで、かなり強い腹痛を訴え続けさせる。\n確認項目：□ 下腹部のシートベルト痕に気づく\n□ 軽症ゾーンでバイタルと腹部所見を反復評価\n□ 腹痛出現時にFASTを実施し陰性でも再検を検討\n□ 赤へアップトリアージし救外へ移送\n□ 外科コンサルトと造影CTを手配\n□ 緊急開腹の手術室と術後ICUを同時に調整","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、BP 118/70、HR 88、SpO2 98%RA、RR 16を確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、頭部MRI異常なし。腹痛出現後: FAST陽性（モリソン窩・骨盤内に液体貯留）。造影CTで腸間膜からの造影剤漏出と腸管壁の血流不良、腹腔内液体貯留、腹壁のシートベルト痕に一致する皮下血腫。Hb 9.2、乳酸 4.2mmol/L。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：乗用車1の同乗者として来院（シートベルト着用）。軽症ゾーンで点滴中（来院約30分後）に腹痛を訴える。下腹部のシートベルト痕に気づけるかを含め、遅発性に腹部所見が出現するシートベルト損傷（腸管・腸間膜損傷）として、軽症ゾーンから救外への移送、緊急手術と術後ICUの手配につなげる判断を促す。\n分岐・悪化条件：対応できた場合: 腹痛出現直後に再評価し、輸液・輸血を行いながら緊急開腹へ進め、循環を保ったまま術後ICUへ入室できる。\n遅れた場合: 「めまいの患者」という先入観で経過観察され、BP 70台・HR 130へ進行して筋性防御が明らかになり、腹膜炎・敗血症へ進展する。\n【傷病者役】開眼でめまい増強。点滴後にめまいは改善するが、コントローラーの合図で腹痛を訴える。以後は手術が決まったと伝えられるまで、かなり強い腹痛を訴え続け、腹部を押さえてぐったりする。","notes":"ムラージュ：下腹部に斜めの帯状皮下出血・擦過傷（シートベルト痕）\n学習ポイント：腹壁の帯状皮下出血（シートベルト徴候）を見たら腸管・腸間膜損傷とChance骨折を疑う。\n腸管・腸間膜損傷は初期のFAST・診察で所見が乏しく、遅発性にショック化する。\n軽症ゾーンに振り分けた患者でも反復評価とアップトリアージが不可欠。\n災害時は緊急手術枠と術後ICUベッドを同時に確保する。"},{"title":"症例6｜前腕擦過傷","arrival_time":"0-3分","phase_1":"【コントローラー】徒歩で到着。一次トリアージ所見を順に提示する。\n一次トリアージ所見：Walk-in。歩行: 可能。呼吸・脈拍・意識: すべて見たまま安定、指示に従える\n【傷病者役】普通に会話、処置を待てる。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：実測値で安定\n診察所見：前腕浅い擦過傷。\n治療判断：洗浄/被覆\n進行指示：前腕擦過傷のみ、バイタル安定。洗浄・被覆後帰宅可能とする。\n確認項目：特になし","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、実測値で安定を確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、画像不要。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：緑患者の受付・帰宅導線確認に使用。\n分岐・悪化条件：対応できた場合: 洗浄・被覆で処置完了となり、帰宅導線に乗せられる。\n遅れた場合: 軽症者が軽症ゾーンに滞留し、受付・処置待ちが混雑して重症度の高い患者の対応が遅れる。\n【傷病者役】普通に会話、処置を待てる。","notes":"ムラージュ：前腕擦過傷\n学習ポイント：浅い擦過傷は洗浄・被覆で対応し、画像検査は不要。\n緑症例を滞りなく帰宅させる導線確保が、軽症ゾーン全体の回転を決める。"},{"title":"症例7｜足背切創","arrival_time":"0-3分","phase_1":"【コントローラー】徒歩で到着。一次トリアージ所見を順に提示する。\n一次トリアージ所見：Walk-in。歩行: 可能。呼吸・脈拍・意識: すべて見たまま安定、指示に従える\n【傷病者役】傷の処置希望。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：実測値で安定\n診察所見：浅い切創、腱損傷なし。\n治療判断：洗浄/縫合検討\n進行指示：止血済み、浅切創、異物なしを提示。洗浄・縫合要否判断を促す。\n確認項目：特になし","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、実測値で安定を確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、異物なし。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：創傷処置待ちを軽症ゾーンに発生させる。\n分岐・悪化条件：対応できた場合: 止血確認・洗浄後に縫合要否を判断し帰宅となる。\n遅れた場合: 異物確認や洗浄が不十分のまま経過し、創部感染のリスクと処置待ちの滞留が生じる。\n【傷病者役】傷の処置 ,"phase_3":"【コントローラー】追加イベント：軽症創傷が複数同時に来る状況を作る。\n分岐・悪化条件：対応できた場合: 腱損傷なしを確認し、洗浄・テープ固定で帰宅となる。\n遅れた場合: 軽症創傷が同時に滞留し、処置待ちの列が伸びて軽症ゾーンの回転が悪化する。\n【傷病者役】処置を待てる。","notes":"ムラージュ：手指切創\n学習ポイント：手指切創では可動域と腱・神経損傷の有無を必ず確認する。\n浅い創は洗浄・テープ固定で十分で、軽症創傷の並列処理がゾーン運営の鍵となる。"},{"title":"症例11｜頭痛・不眠","arrival_time":"0-3分","phase_1":"【コントローラー】徒歩で到着。一次トリアージ所見を順に提示する。\n一次トリアージ所見：Walk-in。歩行: 可能。呼吸・脈拍・意識: すべて見たまま安定、指示に従える\n【傷病者役】疲労感と不眠を訴える。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：実測値で安定\n診察所見：神経脱落症状なし。\n治療判断：内服/帰宅\n進行指示：神経症状なし、バイタル安定を提示。傾聴と帰宅判断を促す。\n確認項目：特になし","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、実測値で安定を確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、検査不要。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：軽症ゾーンで不安訴えへの対応を確認。\n分岐・悪化条件：対応できた場合: 神経症状がないことを確認し、傾聴と内服で帰宅となる。\n遅れた場合: 説明に長時間を要して軽症ゾーンの人員が拘束され、他の黄症例の再評価が遅れる。\n【傷病者役】疲労感と不眠を訴える。","notes":"ムラージュ：記載なし\n学習ポイント：災害ストレスによる頭痛・不眠は神経症状のないことを確認し、過剰検査を避ける。\n傾聴と説明、必要なら内服で帰宅とし、心理面のフォロー先を伝える。"},{"title":"症例12｜軽微外傷＋発熱（幼児）","arrival_time":"0-3分","phase_1":"【コントローラー】徒歩で到着。一次トリアージ所見を順に提示する。\n一次トリアージ所見：徒歩来院（母同伴）。歩行: 可能（幼児設定は保護者同伴で活気あり）。呼吸: RR 28、努力呼吸なし。循環: HR 150だが発熱性頻脈として扱い、末梢冷感なし。意識: 活気あり、指示/呼びかけに反応良好\n【傷病者役】乳幼児人形を使用。母役が付き添い「もともと発熱で小児科受診予定だった」と説明。外傷は軽微。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：BT 38.6、HR 150（発熱性頻脈）、SpO2 98%RA、RR 28、活気あり\n診察所見：前額部・膝の擦過傷のみ、頭部血腫なし、咽頭発赤あり。神経学的異常なし。\n治療判断：創処置＋解熱剤処方。発熱診療は小児科へ引き継ぎ／帰宅。\n進行指示：発熱性頻脈をショックと取り違えないよう指導。緑トリアージの妥当性を確認。\n確認項目：□ 発熱性頻脈をショックと取り違えず緑と判定\n□ 外傷は創処置のみで対応し画像の適応を判断\n□ 嘔吐・意識変容などの危険徴候を確認\n□ 発熱診療の行き先（小児科引き継ぎ／帰宅）を明確化\n□ 家族へ帰宅後のred flagを説明","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、BT 38.6、HR 150（発熱性頻脈）、SpO2 98%RA、RR 28、活気ありを確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、外傷検索の画像は基本不要。発熱に対し必要に応じ迅速検査。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：母同伴で徒歩来院。発熱・頻脈があるが活気良好。小児科への引き継ぎ判断。\n分岐・悪化条件：対応できた場合: 創処置と解熱対応を行い、発熱は小児科へ引き継いで帰宅できる。\n遅れた場合: 発熱性頻脈をショックと誤認して赤へ過大トリアージし資源を消耗する、あるいは「軽微外傷」に引きずられ発熱評価を怠り、活気不良・脱水などの重症感染の兆候を見逃す。\n【傷病者役】乳幼児人形を使用。母役が付き添い「もともと発熱で小児科受診予定だった」と説明。外傷は軽微。","notes":"ムラージュ：前額部・膝の擦過傷\n学習ポイント：幼児の発熱性頻脈（BT 38.6でHR 150）は生理的範囲であり、活気と末梢循環でショックと鑑別する。\n小児頭部外傷はPECARNルールで不要なCTを避ける。\n緑症例でも行き先（disposition）と原疾患のフォローを明確にする。"},{"title":"症例13｜重症頭部外傷（急性硬膜下血腫）","arrival_time":"0-3分","phase_1":"【コントローラー】救急車で到着。救急隊情報として「BP 90/60（来院時、。頭部裂創・皮下血腫、呼びかけにうめくのみ、末梢冷感を伴う外傷性ショック。」を提示する。\n一次トリアージ所見：歩行不能、呼びかけにうめき声のみ、頭皮裂創からの出血を伴うショックバイタル\n【傷病者役】中学生役は学生が演じる（学生演技）。身元不明。来院時は呼びかけにうめくのみで反応が乏しい。ICU入室後、コントローラーの指示のタイミングで片側瞳孔が散大する（アニソコリア）。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：BP 90/60（来院時、。頭部裂創・皮下血腫、呼びかけにうめくのみ、末梢冷感を伴う外傷性ショック\n診察所見：来院時は瞳孔左右差・明らかな四肢麻痺なし。\n治療判断：気管挿管（RSI）、頭皮止血・輸血。初期CTでは緊急手術の適応なく、挿管管理のままICU入室し経過観察。ICU入室後の瞳孔不同・血腫増大を受けて緊急開頭血腫除去術。術後もICU管理。\n進行指示：初期CTは少量の急性硬膜下血腫で正中偏位・脳浮腫なし、FAST陰性と提示し、脳神経外科は緊急手術不要と判断させる。頭皮止血・輸血後はバイタル安定を伝え、挿管管理のままICU入室へ。ICU入室後の良いタイミングで瞳孔不同の出現を伝え、CT再検で血腫増大を提示して緊急手術へ移行させる。ICUと手術室の連絡・緊急手術の受け入れ調整を評価する。\n確認項目：□ GCS 8で頸椎保護下のRSIによる気管挿管を実施\n□ 頭皮裂創を圧迫・縫合/ステープルで止血\n□ 輸血を開始し、他部位の出血源をFASTなどで検索\n□ 初期CTの所見を脳神経外科と共有し方針を確認\n□ 挿管管理のままICU入室を調整\n□ ICUで瞳孔・GCSを反復評価し、瞳孔不同出現時にCTを再検\n□ ICUから手術室・脳神経外科へ緊急開頭を要請し受け入れを調整\n□ 身元不明患者としての登録・緊急輸血・家族探索を並行","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、BP 90/60（来院時、。頭部裂創・皮下血腫、呼びかけにうめくのみ、末梢冷感を伴う外傷性ショックを確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、頭部CTで少量の急性硬膜下血腫。正中偏位・脳浮腫はなし。FASTは陰性。ICU入室後に瞳孔不同が出現し、再検CTで血腫増大を確認。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：気道確保（RSI）と頭皮止血・輸血の同時進行。止血・輸血後にバイタルは安定し、初期CTでは緊急手術の適応なくICU入室。ICU入室後の良いタイミングで瞳孔不同が出現し、CT再検で血腫増大、緊急手術となる二段階の展開。ICUと手術室の連絡調整が必要。\n分岐・悪化条件：対応できた場合: 挿管と頭皮止血・輸血でBP 120/70と循環が安定し、ICUでの反復評価により瞳孔不同を直ちに捕らえてCT再検→緊急開頭血腫除去術へ短時間で移行できる。\n遅れた場合: 挿管が遅れれば舌根沈下・低換気で頭蓋内圧が上昇しCPAに至る。止血・輸血が遅れれば出血性ショックが増悪し二次性脳損傷を助長する。ICUでの瞳孔変化を見逃す・CT再検や手術室連絡が遅れると、テント切痕ヘルニアが進行し不可逆的脳損傷となる。\n【傷病者役】中学生役は学生が演じる（学生演技）。身元不明。来院時は呼びかけにうめくのみで反応が乏しい。ICU入室後、コントローラーの指示のタイミングで片側瞳孔が散大する（アニソコリア）。","notes":"ムラージュ：頭部の大きな裂創からの活動性出血、皮下血腫、顔面血液付着\n学習ポイント：小児は頭皮出血だけでも出血性ショックに至るため、同時に他部位の出血源も検索する。\n低酸素・低血圧を避けることが二次性脳損傷予防の鍵で、GCS≤8は気道確保の適応。\n初期CTが軽微 】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、実測値。頭痛・嘔気・意識障害なしを確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、異常なしを提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：乗用車5で症例36に付き添って来院。重症児対応と並行して家族の軽症外傷をどう処理するかを問う。\n分岐・悪化条件：記載なし\n【傷病者役】前額部の傷を気にして触ろうとする。痛みは軽度。","notes":"ムラージュ：あり\n学習ポイント：前額部擦過傷は洗浄・被覆・ステリテープで対応でき縫合は不要。\n頭痛・嘔気・意識障害がないことを確認して頭部外傷を除外する。\n付き添い家族自身の軽症外傷への対応と、児の状況説明を並行して行う。"},{"title":"症例38｜脳梗塞疑い","arrival_time":"0-3分","phase_1":"【コントローラー】乗用車で到着。一次トリアージ所見を順に提示する。\n一次トリアージ所見：歩行: 不安定で自力歩行困難。呼吸: 見たまま安定。循環: 脈拍は見たまま安定。意識: 指示に従えるが呂律不良あり\n【傷病者役】右足が出しにくく、少し呂律が回らない。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：実測値で安定\n診察所見：バレー陽性、右上下肢軽度脱力。\n治療判断：脳卒中対応（画像評価・適応判断）。EU入院で神経所見を監視。\n進行指示：乗用車4。スーパーで倒れた後の体動困難として登場させ、右上下肢脱力と構音障害を提示。二次トリアージで救外移動を判断させる。\n確認項目：□右上下肢の脱力と呂律不良を提示する\n□二次トリアージで神経所見（バレー徴候・構音）を取り直すか\n□発症時刻／最終未発症時刻を確認するか\n□軽症ゾーンから救外へ移動し脳卒中コードを起動できるか\n□画像評価と再灌流療法の適応判断ができるか","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、実測値で安定を確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、MRIで脳梗塞。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：乗用車4の同乗者として来院。軽症ゾーン混雑時に紛れ込ませ、再評価とゾーン間連絡を確認。\n分岐・悪化条件：二次トリアージで神経所見を評価し救外へ振り分けた場合: 適応に応じてrt-PA・血栓回収療法へ進める。\n「歩けるから緑」と判断し軽症ゾーンで待機させた場合: 治療可能時間を逸失し梗塞が不可逆的に拡大する。\n発症時刻が不明のまま経過した場合: 再灌流療法の適応判断が遅れる。\n【傷病者役】右足が出しにくく、少し呂律が回らない。","notes":"ムラージュ：記載なし\n学習ポイント：脳梗塞は歩行可能でも緊急度が高く、片麻痺・構音障害はトリアージアップの根拠となる。\nrt-PA（発症4.5時間以内）や血栓回収療法の適応は発症時刻に依存するため、最終未発症時刻の確認が最重要。\n二次トリアージで神経所見を取り直す再評価が鍵となる。\n災害時でも内因性疾患は発生し、限られた画像・人的資源の中で適応を判断する。"},{"title":"症例39｜急性腹症疑い","arrival_time":"0-3分","phase_1":"【コントローラー】徒歩で到着。一次トリアージ所見を順に提示する。\n一次トリアージ所見：Walk-in。歩行: 可能。呼吸: 見たまま安定。循環: HR 105、脱水傾向あり。意識: 指示に従える\n【傷病者役】腹部を押さえてうずくまる。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：HR 105、他安定\n診察所見：右下腹部圧痛、反跳痛なし。\n治療判断：輸液・鎮痛・画像評価。外科と協議のうえEU入院で経過観察。\n進行指示：腹痛・嘔吐・脱水傾向を提示し、画像評価と救外移動の判断を促す。\n確認項目：□ 二次トリアージでHR105・嘔吐反復・脱水を確認したか\n□ 「歩けるから緑」で固定せず再評価したか\n□ 輸液・鎮痛を開始したか\n□ 画像（CT）の必要性と優先順位を判断したか\n□ 外科と協議しEU入院を調整したか","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、HR 105、他安定を確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、採血で脱水、CTで虫垂炎/腸炎鑑別。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：軽症ゾーン混雑時に非外傷疾患を混ぜ、見落としを防ぐ訓練にする。\n分岐・悪化条件：対応できた場合: 二次評価でトリアージアップし、輸液・鎮痛と画像評価のうえEU入院で経過観察に入れる。\n遅れた場合: 軽症ゾーンで待機が続き、脱水と腹痛が進行して反跳痛の出現・頻脈増悪など腹膜炎徴候が顕在化する。\n【傷病者役】腹部を押さえてうずくまる。","notes":"ムラージュ：記載なし\n学習ポイント：歩行可能な腹痛でも、頻脈（HR105）・反復する嘔吐・脱水は緊急度上昇のサイン。\n反跳痛がなくても虫垂炎・腸炎は経時的に進行するため、一度のトリアージで固定せず再評価する。\n脱水補正・鎮痛と外科適応の判断、災害時の画像・検査資源の配分を意識する。"},{"title":"症例40｜肝損傷","arrival_time":"0-3分","phase_1":"【コントローラー】救急車で到着。救急隊情報として「HR 125、BP 78/50、SpO2 94%RA、RR 30」を提示する。\n一次トリアージ所見：右側腹部痛、低血圧、頻脈、右側腹部圧痛・筋性防御\n【傷病者役】右上腹部を強く押さえ、前傾姿勢でぐったり。体動や触診で激痛。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：HR 125、BP 78/50、SpO2 94%RA、RR 30\n診察所見：右側腹部に圧痛・筋性防御、顔面やや蒼白。TAE後は腹部膨満が進行。\n治療判断：輸液・輸血、肝損傷に対しTAE（AG）で止血。TAE後に再出血して循環が不安定となり、緊急開腹によるダメージコントロール手術（ガーゼパッキング）を施行。腹部術後のためICU管理。\n進行指示：FAST陽性を提示し、造影CT/止血治療の優先順位判断を促す。TAE後にBP 76/48・HR 135・Hb 6.8・腹部膨満を提示し、再出血に対する緊急開腹（ダメージコントロール手術）と術後ICU入室の調整を判断させる。カテ室・手術室・ICUの同時調整が必要な症例として扱う。\n確認項目：□ FASTを実施し陽性所見をチームで共有したか\n□ 輸液・輸血への反応（responder／transient／non-responder）を分類したか\n□ 血行動態からCT室へ運べるかを判断したか\n□ AG室へTAEを依頼したか\n□ TAE後の血圧低下・Hb低下・腹部膨満から再出血を捉えたか\n□ 緊急開腹（ダメージコントロール手術）と術後ICU入室を調整したか","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、HR 125、BP 78/50、SpO2 94%RA、RR 30を確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、FAST: モリソン窩陽性。造影CT: 肝損傷、腹腔内出血。TAE後: Hb 6.8へ低下、FASTで腹腔内液体の増加。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：TAE終了後、ERでの処置中に血圧低下と腹部膨満を付与し、再出血に対する緊急開腹（ダメージコントロール）と術後ICU入室の調整を判断させる。以降は演技不要で、モニター値・検査値の提示で進行させる。\n分岐・悪化条件：対応できた場合: TAEで一旦止血し、再出血を早期に捉えて緊急開腹→ICU入室まで滞りなく進む。\n遅れた場合: transient responderを安定と誤認してCT室や待機で時間を浪費し、BP・Hbがさらに低下、腹部膨満が進行して開腹止血までの時間が延びる。\n【傷病者役】右上腹部を強く押さえ、前傾姿勢でぐったり。体動や触診で激痛。","notes":"ムラージュ：不要\n学習ポイント：鈍的腹部外傷＋FAST陽性（モリソン窩）＋ショックでは、輸液・輸血への反応性で方針が分かれる。\n安定化すれば造影CT→TAEなどの非手術的管理、反応不良なら緊急開腹止血を躊躇しない。\nTAE後も再出血しうるため、血圧・Hb・腹部所見の反復評価とダメージコントロール手術への切り替え判断が要る。"},{"title":"症例41｜大腿骨骨折＋脂肪塞栓症候群","arrival_time":"0-3分","phase_1":"【コントローラー】乗用車で到着。一次トリアージ所見を順に提示する。\n一次トリアージ所見：歩行: 歩行不能のため黄。呼吸: 初期は見たまま、その後SpO2 80%RAを付与。循環: 初期HR 100、BP 120/70。意識: 初期は指示に従えるが、二次で突然ぐったりし意識低下\n【傷病者役】一次〜二次までは右大腿を痛がる。二次からJCS20まで悪化し、呼吸を荒くする。酸素後も意識は悪いまま。挿管以降は反応を返さず、コントローラーの数値提示で進行する（演技不要）。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：初期: BP 120/70、HR 100、SpO2 96%RA\n診察所見：右大腿部の腫脹と圧痛、大腿中央部変形、患肢短縮と外旋位。\n治療判断：骨折固定、酸素投与のうえ気管挿管・人工呼吸管理（肺保護換気・高PEEP）。P/F比 55と極端な酸素化不良でECMO導入の可能性ありとしてICU入室。骨接合術は全身状態安定後に予定。\n進行指示：初期は大腿骨骨折として提示。途中でSpO2 80%、意識低下、点状出血を付与し救外移動を促す。挿管・人工呼吸後もPaO2 55mmHg（FiO2 1.0）＝P/F比 55と提示し、ECMO導入の可能性を含むICU入室と臨床工学技士の招集、骨接合術の延期を判断させる。\n確認項目：□ 二次トリアージ中のSpO2低下・意識変容を捉えたか\n□ 点状出血を含む三徴を確認し赤へトリアージアップしたか\n□ 大腿骨骨折を早期に固定したか\n□ 気管挿管・肺保護換気（高PEEP）へ移行したか\n□ P/F比55の高度低酸素を共有し、ECMO準備をICU・臨床工学技士へ依頼したか\n□ 骨接合術の延期とICU入室を調整したか","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、初期: BP 120/70、HR 100、SpO2 96%RAを確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、X線: 大腿骨骨幹部骨折。胸部X線・CT: 両肺びまん性のすりガラス〜snow storm様陰影。血液ガス: PaO2 55mmHg（FiO2 1.0）でP/F比 55。血小板低下、Hb低下。MRI: 脂肪塞栓症候群。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：乗用車6で来院。同乗の症例45（胸部症状）と同時に受付となる。軽症ゾーン混雑時に発生させ、再評価能力を確認する。挿管・人工呼吸後も酸素化が改善しない設定とし、ECMO導入の可能性ありとしてICU・臨床工学技士へ準備を依頼させる。\n分岐・悪化条件：対応できた場合: 急変を早期に捉えて酸素投与・挿管へ移行し、ICU入室とECMO準備の手配を並行して進められる。\n遅れた場合: 骨折のみと判断して監視が弱く、SpO2低下と意識障害が進行してARDS様の呼吸不全となり、挿管・ECMO調整が後手に回る。\n【傷病者役】一次〜二次までは右大腿を痛がる。二次からJCS20まで悪化し、呼吸を荒くする。酸素後も意識は悪いまま。挿管以降は反応を返さず、コントローラーの数値提示で進行する（演技不要）。","notes":"ムラージュ：不要\n学習ポイント：長管骨骨折後12〜72時間に、呼吸障害・意識障害・点状出血の三徴で脂肪塞栓症候群を発症しうる。\n早期の骨折固定が予防に有効で、経過観察中の急変（SpO2低下）を捉える再評価が重要。\n人工呼吸管理のみならEUだが、P/F比が極端に低くECMO候補となる例は絶対的ICU適応であり、回路・臨床工学技士の資源調整が要る。"},{"title":"症例42｜軽い腹痛","arrival_time":"0-3分","phase_1":"【コントローラー】徒歩で到着。一次トリアージ所見を順に提示する。\n一次トリアージ所見：Walk-in。歩行: 可能。呼吸・脈拍・意識: すべて見たまま安定、指示に従える\n【傷病者役】普通に会話可能。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：実測値で安定\n診察所見：腹部軟、反跳痛なし。\n治療判断：経過観察\n進行指示：腹部軟、反跳痛なし、バイタル安定を提示。経過観察後に帰宅可能とする。\n確認項目：□ 腹部所見（腹部軟、反跳痛なし）を確認したか\n□ バイタル安定を確認したか\n□ 過剰な検査を ない。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：JCS10、GCS 13（E3V4M6）、BP 62/35、HR 130、SpO2 88%（15L）\n診察所見：皮下気腫著明、右呼吸音減弱、フレイルチェストあり。ドレーン・挿管後にSpO2改善。\n治療判断：直ちに胸腔減圧、胸腔ドレーン、必要時に気管挿管・人工呼吸管理。循環・呼吸が安定後にCT。手術は要しないためEU入院。\n進行指示：右呼吸音減弱、頸静脈怒張、ショックを提示。緊張性気胸として迅速処置を促す。\n確認項目：□ 頸静脈怒張・右呼吸音減弱・ショックから緊張性気胸を臨床診断したか\n□ CTを待たずに胸腔減圧→胸腔ドレーンを行ったか\n□ 減圧前の陽圧換気を避けたか\n□ 循環・呼吸が安定してからCTを実施したか\n□ フレイルチェストに対し挿管・陽圧換気と鎮痛を行ったか\n□ 人工呼吸管理を継続する入院先（EU）を本部と調整したか","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、JCS10、GCS 13（E3V4M6）、BP 62/35、HR 130、SpO2 88%（15L）を確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、胸腔減圧・胸腔ドレーンで安定化後のCT: 右多発肋骨骨折、気胸。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：症例47（クラッシュ症候群）と相前後して到着。重症呼吸不全と透析候補が重なり、本部での入院先調整を促す。\n分岐・悪化条件：対応できた場合: 即時減圧で閉塞性ショックが改善し、BP・SpO2が回復して安定後のCT・人工呼吸管理へ進める。\n遅れた場合: 画像待ちで減圧が遅れ、血圧・SpO2がさらに低下して心停止に至る。減圧前に陽圧換気を行うと緊張性気胸が増悪する。\n【傷病者役】右胸部を痛がり、ぐったりして会話はほとんどできない。","notes":"ムラージュ：不要\n学習ポイント：頸静脈怒張＋呼吸音減弱＋ショックは緊張性気胸で、画像を待たず臨床診断で即時減圧する。\n奇異呼吸を伴うフレイルチェストは肺挫傷を合併し、挿管・陽圧換気と鎮痛が有効。\n陽圧換気の前提として胸腔減圧が必須である。\n手術を要さず循環が安定すれば、人工呼吸管理はEUで継続する。"},{"title":"症例47｜クラッシュ症候群","arrival_time":"0-3分","phase_1":"【コントローラー】救急車で到着。救急隊情報として「BP 110/68、HR 88、SpO2 97%RA、RR 20。」を提示する。\n一次トリアージ所見：下腿腫脹、水疱、知覚低下、褐色尿\n【傷病者役】下腿のしびれ、動かせない。治療遅延でCPAへ。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：BP 110/68、HR 88、SpO2 97%RA、RR 20\n診察所見：右下腿腫脹、知覚麻痺、足趾運動低下。\n治療判断：大量輸液、高カリウム補正、CRRT（血液浄化）導入。デバイス装着のためICU管理。\n進行指示：下腿腫脹、褐色尿、高Kを提示。大量輸液・高K補正に加え、CRRT導入とICU入室、臨床工学技士の招集など自院内の調整を判断させる。\n確認項目：□ 心電図モニタを装着し高K血症の変化を監視したか\n□ 早期から大量輸液を開始したか\n□ 高K血症にカルシウム・GI療法を行ったか\n□ 褐色尿・CK高値から色素性腎症を想起し尿量を確保したか\n□ コンパートメント症候群を評価したか\n□ CRRT導入とICU入室、臨床工学技士の招集を調整したか","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、BP 110/68、HR 88、SpO2 97%RA、RR 20を確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、血液ガスでK高値、CK高値、褐色尿。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：救急車⑧で搬入し、重症患者の優先順位を確認。\n分岐・悪化条件：対応できた場合: 輸液と高K補正で致死性不整脈を回避し、尿量を保ちながらCRRT導入とICU管理へ移行できる。\n遅れた場合: 高K血症が進行しテント状T波→QRS開大→sine waveからVF／心停止に至り、輸液不足で色素性腎症によるAKIが進行する。\n【傷病者役】下腿のしびれ、動かせない。治療遅延でCPAへ。","notes":"ムラージュ：右下腿腫脹・水疱\n学習ポイント：クラッシュ症候群は圧挫解除の前後にreperfusion injuryで急変し、心電図モニタと大量輸液を先行させる。\n高K血症の心電図変化（テント状T波→QRS開大→sine wave）を認識し直ちに治療する。\n色素性腎症予防のための輸液・尿量管理と、CRRT（透析）の適応判断が重要。\n区画（コンパートメント）症候群の評価を忘れない。"},{"title":"症例48｜シートベルト外傷（腹部）","arrival_time":"0-3分","phase_1":"【コントローラー】救急車で到着。救急隊情報として「BP 110/70、HR 118、SpO2 98%RA、RR 22、BT 36.8。」を提示する。\n一次トリアージ所見：歩行可だが腹痛で前屈み、シートベルト痕、頻脈。血圧は保たれる\n【傷病者役】中学生役は学生が演じる（学生演技）。腹部を押さえて痛がり、バイタルは保たれるが腹痛が増強していく。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：BP 110/70、HR 118、SpO2 98%RA、RR 22、BT 36.8\n診察所見：下腹部〜臍部にシートベルトサイン、腹部圧痛、上肢・顔面に打撲痕。\n治療判断：救外で反復評価。腹部所見増悪時は外科コンサルのうえEU入院。\n進行指示：腹痛増強・バイタル変化を段階的に提示し、経過観察→入院の判断を促す。\n確認項目：□ 来院時は緑として受け入れ、救外ゾーンで反復評価したか\n□ シートベルトサインを深部臓器損傷のレッドフラッグとして共有したか\n□ FAST・造影CT・採血を実施し経時フォローしたか\n□ 頻脈先行の代償性ショックを認識したか\n□ 腰背部痛・下肢神経症状からChance骨折を評価したか\n□ 所見増悪時に外科コンサルトとEU入院を調整したか","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、BP 110/70、HR 118、SpO2 98%RA、RR 22、BT 36.8を確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、FASTで明らかな腹腔内液貯留なし。造影CTで腸間膜・消化管損傷の有無を評価。採血で経時フォロー。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：時間とともに腹痛が増強（遅発性腸管・腸間膜損傷の懸念）。増悪時は入院・外科コンサル。\n分岐・悪化条件：対応できた場合: 反復評価で増悪を早期に捉え、外科コンサルトのうえEU入院で経過観察できる。\n遅れた場合: 腹痛増悪・腹膜刺激徴候・発熱や、FAST陽性転化・Hb低下・血圧低下が顕在化し、開腹手術が必要となる。\n【傷病者役】中学生役は学生が演じる（学生演技）。腹部を押さえて痛がり、バイタルは保たれるが腹痛が増強していく。","notes":"ムラージュ：腹部の帯状皮下出血（シートベルトサイン）、顔面・上肢打撲痕\n学習ポイント：シートベルトサインは腸管・腸間膜損傷やChance骨折のレッドフラッグで、外表が軽くても油断しない。\n中空臓器損傷はFASTや初回CTで見逃されやすく、反復した腹部診察と再評価が重要。\n頻脈先行・血圧維持の代償性ショックを認識し、非代償化を早期に察知する。"},{"title":"症例49｜頸椎捻挫","arrival_time":"0-3分","phase_1":"【コントローラー】徒歩で到着。一次トリアージ所見を順に提示する。\n一次トリアージ所見：徒歩来院。歩行: 可能。呼吸・脈拍・意識: すべて見たまま安定、指示に従える\n【傷病者役】後頚部から右肩にかけて痛いと訴える。激痛ではない。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：実測値\n診察所見：後頚部〜僧帽筋の疼痛。診察所見は異常なし。\n治療判断：鎮痛、経過観察\n進行指示：激痛ではなく、神経脱落なし。頸椎レントゲン異常なしを提示し経過観察へ。\n確認項目：□ 神経脱落症状の有無を確認したか\n□ 頸椎レントゲンの必要性を判断したか\n□ 鎮痛と経過観察の説明を行ったか\n□ 終盤の患者情報入力と帰宅導線を確認したか","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、実測値を確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、頸椎レントゲンを行っても異常なし。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：徒歩来院の最終波。終盤の情報入力遅延と帰宅導線を確認。\n分岐・悪化条件：対応できた場合: 鎮痛・経過観察で帰宅となり、終盤の情報入力と帰宅導線が滞らない。\n遅れた場合: 記録・情報入力が滞留し、帰宅手続きが遅れて軽症ゾーンの撤収に影響する。\n【傷病者役】後頚部から右肩にかけて痛いと訴える。激痛ではない。","notes":"ムラージュ：不要\n学習ポイント：明らかな強打がなく神経脱落症状もない後頸部痛は、頸椎捻挫として鎮痛・経過観察とする。\n画像で異常がなければ帰宅可能と判断し、終盤の記録・帰宅導線を滞らせない。"},{"title":"症例50｜右下腿開放骨折","arrival_time":"0-3分","phase_1":"【コントローラー】救急車で到着。救急隊情報として「HR 110、BP 145/88、SpO2 95%RA、RR 20」を提示する。\n一次トリアージ所見：右下腿約10cm開放創、骨露出、出血持続、下腿変形\n【傷病者役】右下腿を見ないようにし、創部出血を心配する。わずかな振動でも激痛。手術時期を不安がる。","care_time":"3-12分","phase_2":"【コントローラー】初回バイタル：HR 110、BP 145/88、SpO2 95%RA、RR 20\n診察所見：右下腿に開放創、出血あり圧迫止血中、歩行不可。\n治療判断：止血・固定、緊急手術（洗浄・デブリドマン＋骨折固定）。術後はEUもしくは一般病床入院。\n進行指示：右下腿開放創・骨露出・出血を提示。洗浄・抗菌薬・固定のうえ、症例40・症例45など他の緊急症例との手術室優先順位調整を促す。\n確認項目：□ 圧迫止血を継続し出血をコントロールしたか\n□ 創部洗浄と抗菌薬投与を早期に行ったか\n□ 下腿の固定と疼痛管理を行ったか\n□ 末梢循環・神経所見を評価したか\n□ 手術室の空き状況を確認し、他の緊急手術（症例40・45等）との優先順位を調整したか\n□ 術後の入院先（EUまたは一般病床）を確保したか","media":"【モニター】プレイヤーがモニター装着を依頼した時点で、「モニター画面のQRコード」を提示し、HR 110、BP 145/88、SpO2 95%RA、RR 20を確認させる。\n【検査・画像】プレイヤーが検査または画像撮影を決定した時点で、「検査・画像のQRコード」を提示する。確認後に、レントゲン: 右下腿開放骨折。を提示する。","event_time":"12-20分（該当時）","phase_3":"【コントローラー】追加イベント：手術室・カテーテル治療の優先順位調整が必要となる。\n分岐・悪化条件：対応できた場合: 洗浄・抗菌薬・固定のうえ手術順位を調整し、緊急手術後にEUまたは一般病床へ入院できる。\n遅れた場合: 洗浄・抗菌薬が遅れて創部汚染が進み、手術待機が長引いて出血と疼痛の管理が困難になる。\n【傷病者役】右下腿を見ないようにし、創部出血を心配する。わずかな振動でも激痛。手術時期を不安がる。","notes":"ムラージュ：あり\n学習ポイント：開放骨折は早期の洗浄・デブリドマンと抗菌薬投与、確実な固定が基本。\n出血は圧迫止血で管理し、末梢循環・神経所見を評価する。\n手術室逼迫時は自院内での手術順位調整と術後入院先の確保が必要。"}]</script>
<script>
const esc=s=>String(s??"記載なし").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function body(s){const labels=/^(一次トリアージ所見|初回バイタル|診察所見|治療判断|進行指示|確認項目|追加イベント|分岐・悪化条件)：/;return esc(s).split("\n").map(line=>{const tag=line.match(labels);let x=line.replace(/【([^】]+)】/g,"<span class=\"role\">$1</span>");if(tag)x="<span class=\"sub\">"+tag[1]+"</span>"+x.slice(tag[0].length);return '<div class="body-line">'+x+'</div>'}).join("");}
function phase(num,label,time,content,kind,extra=""){const empty=!content||content==="該当なし";return '<section class="phase '+kind+(empty?' no-event':'')+'"><div class="phase-head"><span class="num">'+num+'</span><h2>'+label+'</h2><time>'+esc(time)+'</time></div><div class="body">'+(empty?'追加設定なし':body(content))+'</div>'+extra+'</section>';}
const cases=JSON.parse(document.getElementById("cases").textContent);
document.getElementById("root").innerHTML=cases.map(c=>'<article class="sheet"><header><div class="eyebrow">2026 災害訓練　コントローラー配布資料</div><h1>'+esc(c.title)+'</h1><p class="lead">本体症例とリンクした、時系列の進行・提示資料</p></header><main class="timeline">'+phase("01","到着・一次評価",c.arrival_time,c.phase_1,"arrival")+phase("02","初療から治療へ",c.care_time,c.phase_2,"care",'<section class="media"><h3>検査・モニター提示</h3><div class="body">'+body(c.media)+'</div></section>')+phase("03","急変・追加設定",c.event_time,c.phase_3,"event")+'</main><aside><div class="aside-label">固定情報・備考</div><div>'+body(c.notes)+'</div></aside><footer>コントローラ配布資料（症例別）をもとに生成　|　'+esc(c.title)+'</footer></article>').join("");
function overflows(sheet){const aside=sheet.querySelector("aside");const footer=sheet.querySelector("footer");const phaseLimit=aside.getBoundingClientRect().top-2;const sheetLimit=sheet.getBoundingClientRect().bottom-2;return[...sheet.querySelectorAll(".phase,.media")].some(el=>el.scrollHeight>el.clientHeight+1||el.getBoundingClientRect().bottom>phaseLimit)||aside.scrollHeight>aside.clientHeight+1||footer.getBoundingClientRect().bottom>sheetLimit}
function fitSheets(){document.querySelectorAll(".sheet").forEach((sheet,index)=>{const chars=Object.values(cases[index]).join("").length;let fit=chars>3200?.42:chars>2600?.46:chars>2100?.50:chars>1600?.55:chars>1200?.62:.75;sheet.style.setProperty("--fit",fit);for(let i=0;i<16&&overflows(sheet)&&fit>.34;i++){fit-=.02;sheet.style.setProperty("--fit",fit.toFixed(3));}})}
fitSheets();
requestAnimationFrame(()=>requestAnimationFrame(fitSheets));
window.addEventListener("beforeprint",fitSheets);
window.addEventListener("resize",fitSheets);
</script></body></html>
